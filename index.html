<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLY Fon Portföy Takip</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--text-primary);
        }

        .status-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: #e5e7eb;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-badge.error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* Data Display Section */
        .market-data-card {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
        }

        .fund-name {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .daily-change {
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        /* Input Form */
        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            ring: 2px solid #3b82f6;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-save:hover {
            background-color: #2563eb;
        }

        /* Results Section */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            flex-direction: column;
        }

        .result-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.125rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .full-width {
            grid-column: span 2;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            color: transparent !important;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .last-updated {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TLY Fon Takip</h1>
        <div id="connectionStatus" class="status-badge">BAĞLANIYOR...</div>
    </header>

    <!-- Piyasa Verisi Göstergesi -->
    <div class="market-data-card">
        <div class="fund-name">TLY - Günlük Değişim</div>
        <div id="dailyChangeDisplay" class="daily-change skeleton">--%</div>
    </div>

    <!-- Kullanıcı Girişleri -->
    <div class="input-group">
        <label for="lotInput">Lot Adedi</label>
        <input type="number" id="lotInput" placeholder="Örn: 150" step="0.0001">
    </div>

    <div class="input-group">
        <label for="costInput">Ortalama Maliyet (Birim Fiyat)</label>
        <input type="number" id="costInput" placeholder="Örn: 1.85" step="0.0001">
    </div>

    <div class="input-group">
        <label for="taxInput">Stopaj Oranı (%)</label>
        <input type="number" id="taxInput" value="0" placeholder="Örn: 0 (BES ise 0)" step="0.1">
    </div>

    <button class="btn-save" onclick="saveData()">Hesapla ve Kaydet</button>

    <!-- Sonuçlar -->
    <div class="results-grid">
        <div class="result-item full-width">
            <span class="result-label">Toplam Yatırım Tutarı</span>
            <span id="totalInvestment" class="result-value skeleton">-- TL</span>
        </div>
        
        <div class="result-item">
            <span class="result-label">Günlük Brüt Kar/Zarar</span>
            <span id="dailyProfit" class="result-value skeleton">-- TL</span>
        </div>

        <div class="result-item">
            <span class="result-label">Günlük Net Kar/Zarar</span>
            <span id="dailyNetProfit" class="result-value skeleton">-- TL</span>
        </div>

        <div class="result-item full-width" style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e7eb;">
            <span class="result-label">Tahmini Toplam Değer (Anlık)</span>
            <span id="currentValue" class="result-value skeleton">-- TL</span>
        </div>
    </div>

    <div class="last-updated" id="lastUpdated">Son güncelleme: Hiçbir zaman</div>
</div>

<script>
    // --- Yapılandırma ---
    // TLY Fonu (TEB Limon Tipi Fon) için alternatif veri kaynakları
    // fvt.com.tr Cloudflare korumalı olduğu için alternatif API'ler kullanıyoruz.
    const DATA_SOURCES = [
        // 1. TEB Portföy API (Fonun kendi sitesi - en güvenilir)
        {
            url: 'https://www.tebportfoy.com.tr/api/fund/getFundDailyChart?fundCode=TLY&period=1',
            parse: (data) => {
                const json = JSON.parse(data);
                if (json && json.data && json.data.length > 0) {
                    // Son iki günü alarak değişimi hesapla
                    const today = json.data[json.data.length - 1];
                    const yesterday = json.data[json.data.length - 2];
                    if (today && yesterday) {
                        const change = ((today.value - yesterday.value) / yesterday.value) * 100;
                        return change;
                    }
                }
                return null;
            }
        },
        // 2. Fintables (Alternatif - bazen çalışır)
        {
            url: 'https://fintables.com/api/v1/funds/TLY',
            parse: (data) => {
                const json = JSON.parse(data);
                if (json && json.changePercent) return json.changePercent;
                return null;
            }
        }
    ];

    // --- State Yönetimi ---
    let currentDailyChangePercent = 0;
    let refreshInterval;

    // --- DOM Elementleri ---
    const els = {
        status: document.getElementById('connectionStatus'),
        changeDisplay: document.getElementById('dailyChangeDisplay'),
        lot: document.getElementById('lotInput'),
        cost: document.getElementById('costInput'),
        tax: document.getElementById('taxInput'),
        totalInv: document.getElementById('totalInvestment'),
        dailyProf: document.getElementById('dailyProfit'),
        dailyNetProf: document.getElementById('dailyNetProfit'),
        currVal: document.getElementById('currentValue'),
        lastUpd: document.getElementById('lastUpdated')
    };

    // --- Başlangıç ---
    function init() {
        loadLocalData();
        fetchMarketData();
        refreshInterval = setInterval(fetchMarketData, 60000);
    }

    // --- Veri Çekme Mantığı ---
    async function fetchMarketData() {
        updateStatus('connecting', 'Veri Alınıyor...');
        
        let success = false;

        for (const source of DATA_SOURCES) {
            try {
                console.log(`Denenen kaynak: ${source.url}`);
                // Not: Çoğu finans API'si CORS izni vermez. 
                // Tarayıcıdan direkt çekemiyorsak kullanıcıya bilgi verip manuel girişe izin veriyoruz.
                const response = await fetch(source.url, { 
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const rawData = await response.text();
                const parsedValue = source.parse(rawData);

                if (parsedValue !== null && !isNaN(parsedValue)) {
                    currentDailyChangePercent = parsedValue;
                    success = true;
                    break;
                }
            } catch (error) {
                console.warn(`Kaynak başarısız: ${source.url}`, error);
                continue;
            }
        }

        if (success) {
            updateUI(true);
            calculateResults();
            updateStatus('connected', 'Canlı Veri');
            
            const now = new Date();
            els.lastUpd.textContent = `Son güncelleme: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        } else {
            // API'lerin hiçbiri çalışmazsa (CORS vb.)
            updateStatus('error', 'Otomatik Çekilemedi');
            console.log("Hiçbir API'den veri çekilemedi. Manuel giriş bekleniyor.");
            
            // Eğer daha önce veri varsa onu göstermeye devam et, yoksa skeleton kalır
            if(currentDailyChangePercent !== 0 || els.changeDisplay.textContent !== '--%') {
                 // Eski veri varsa silme
            } else {
                els.changeDisplay.textContent = "N/A";
                els.changeDisplay.classList.remove('skeleton');
            }
        }
    }

    // --- Hesaplama Motoru ---
    function calculateResults() {
        const lot = parseFloat(els.lot.value) || 0;
        const unitCost = parseFloat(els.cost.value) || 0;
        const taxRate = parseFloat(els.tax.value) || 0;

        if (lot === 0 || unitCost === 0) {
            return; 
        }

        const totalInvestment = lot * unitCost;
        const dailyGrossProfit = totalInvestment * (currentDailyChangePercent / 100);
        
        let taxAmount = 0;
        if (dailyGrossProfit > 0) {
            taxAmount = dailyGrossProfit * (taxRate / 100);
        }

        const dailyNetProfit = dailyGrossProfit - taxAmount;
        const estimatedCurrentValue = totalInvestment + dailyGrossProfit;

        els.totalInv.textContent = formatMoney(totalInvestment);
        
        els.dailyProf.textContent = formatMoney(dailyGrossProfit);
        els.dailyProf.className = `result-value ${dailyGrossProfit >= 0 ? 'positive' : 'negative'}`;

        els.dailyNetProf.textContent = formatMoney(dailyNetProfit);
        els.dailyNetProf.className = `result-value ${dailyNetProfit >= 0 ? 'positive' : 'negative'}`;

        els.currVal.textContent = formatMoney(estimatedCurrentValue);
    }

    // --- UI Güncellemeleri ---
    function updateUI(dataLoaded) {
        if (!dataLoaded) return;

        els.changeDisplay.classList.remove('skeleton');
        els.changeDisplay.textContent = `%${currentDailyChangePercent.toFixed(3)}`;
        
        if (currentDailyChangePercent >= 0) {
            els.changeDisplay.className = 'daily-change positive';
        } else {
            els.changeDisplay.className = 'daily-change negative';
        }

        if (els.lot.value && els.cost.value) {
            calculateResults();
        } else {
            els.totalInv.textContent = "-- TL";
            els.dailyProf.textContent = "-- TL";
            els.dailyNetProf.textContent = "-- TL";
            els.currVal.textContent = "-- TL";
        }
    }

    function updateStatus(state, text) {
        els.status.textContent = text;
        els.status.className = 'status-badge';
        if (state === 'connected') els.status.classList.add('connected');
        if (state === 'error') els.status.classList.add('error');
    }

    function formatMoney(amount) {
        return amount.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' });
    }

    // --- Local Storage İşlemleri ---
    function saveData() {
        const data = {
            lot: els.lot.value,
            cost: els.cost.value,
            tax: els.tax.value
        };
        localStorage.setItem('tly_portfolio_data', JSON.stringify(data));
        
        if(!els.changeDisplay.classList.contains('skeleton')) {
             calculateResults();
             alert('Veriler kaydedildi ve hesaplandı!');
        } else {
             alert('Veriler kaydedildi, ancak henüz piyasa verisi çekilemedi. Bekleyiniz...');
        }
    }

    function loadLocalData() {
        const saved = localStorage.getItem('tly_portfolio_data');
        if (saved) {
            const data = JSON.parse(saved);
            els.lot.value = data.lot || '';
            els.cost.value = data.cost || '';
            els.tax.value = data.tax || '0';
        }
    }

    init();

</script>

</body>
</html>
